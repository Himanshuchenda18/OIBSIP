<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator Pro | Advanced Web Calculator</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-container">
<header class="header">
<h1>⚡ Calculator Pro</h1>
<p>Advanced Scientific Calculator built with HTML, CSS & JavaScript</p>
</header>
<div class="calculator-container">
<div class="display-container">
<div class="history" id="history"></div>
<input type="text" id="display" class="display" placeholder="0" disabled>
</div>
<div class="buttons">
<button class="function" onclick="clearDisplay()">AC</button>
<button class="function" onclick="deleteNumber()">DEL</button>
<button class="function" onclick="appendValue('(')">(</button>
<button class="operator" onclick="appendValue(')')">)</button>
<button class="scientific" onclick="squareRoot()">√</button>
<button class="scientific" onclick="squareNumber()">x²</button>
<button class="scientific" onclick="appendValue('^')">xʸ</button>
<button class="operator" onclick="appendValue('/')">÷</button>
<button onclick="appendValue('7')">7</button>
<button onclick="appendValue('8')">8</button>
<button onclick="appendValue('9')">9</button>
<button class="operator" onclick="appendValue('*')">×</button>
<button onclick="appendValue('4')">4</button>
<button onclick="appendValue('5')">5</button>
<button onclick="appendValue('6')">6</button>
<button class="operator" onclick="appendValue('-')">−</button>
<button onclick="appendValue('1')">1</button>
<button onclick="appendValue('2')">2</button>
<button onclick="appendValue('3')">3</button>
<button class="operator" onclick="appendValue('+')">+</button>
<button onclick="appendValue('0')">0</button>
<button onclick="appendValue('.')">.</button>
<button class="scientific" onclick="appendValue('%')">%</button>
<button class="equal" onclick="calculate()">=</button>
</div>
</div>
<footer>
<p>© 2026 Calculator Pro 
</footer>
</div>
<script src="js/script.js"></script>
</body>
</html>
